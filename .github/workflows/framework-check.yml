name: framework-check

# Roda os validators do framework sobre todos os registries do repositório
# central, em modo bloqueante.
#
# Regra nova não reprova documento antigo: cada exigência declara em que
# versão entrou (validate_doc.RULE_SINCE) e só vale para projeto cujo
# registry declara framework_version igual ou posterior.
#
# Marque `validate` como check obrigatório na branch protection para que
# reprovar aqui realmente bloqueie o merge.

on:
  pull_request:
    paths:
      - "docs/**"
      - "_framework/**"
      - ".github/workflows/framework-check.yml"
  push:
    branches: [main]
  workflow_dispatch:

env:
  REPORT_ONLY: ""

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o check de mensagens de commit compara
          # origin/<base>..HEAD e precisa dos dois lados.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check _framework/scripts

      - name: Typecheck (mypy)
        run: mypy _framework/scripts

      - name: Formatter (ruff format --check)
        run: ruff format --check _framework/scripts

      - name: Testes de mechanization (render_prompts.py)
        run: python3 -m pytest _framework/scripts/tests/ -v

      - name: Validar registries e documentos
        run: python3 _framework/scripts/framework_check.py --auto $REPORT_ONLY

      - name: Renderizações concordam com o núcleo canônico
        run: |
          python3 _framework/scripts/render_prompts.py --check
          python3 _framework/scripts/check_renderings.py $REPORT_ONLY

      - name: Testes de paridade e consistência (_framework/tests)
        run: python3 -m pytest _framework/tests/ -v

      - name: Índices de SDD e registry.md em dia
        run: |
          python3 _framework/scripts/render_indexes.py --check
          python3 _framework/scripts/generate_registry_md.py docs/DTF --check

      - name: Higiene de cache (ignorados e não rastreados)
        run: |
          for d in .ruff_cache .pytest_cache .mypy_cache _framework/scripts/__pycache__; do
            git check-ignore -q "$d" || { echo "cache não ignorado pelo .gitignore da raiz: $d"; exit 1; }
          done
          if git ls-files | grep -E '(^|/)(\.ruff_cache|\.pytest_cache|\.mypy_cache|__pycache__)/'; then
            echo "cache rastreado acima"; exit 1
          fi
          if git status --porcelain --untracked-files=all | grep -E '(_cache|__pycache__|\.pyc)'; then
            echo "cache aparece no git status acima"; exit 1
          fi

      - name: Validar mensagens de commit do PR
        if: github.event_name == 'pull_request'
        run: |
          python3 _framework/scripts/check_commit.py \
            --range "origin/${{ github.base_ref }}..HEAD" $REPORT_ONLY
        env:
          REPORT_ONLY: ${{ env.REPORT_ONLY }}
